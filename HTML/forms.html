<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <form action="">
        <label for="">First Name <sup>*</sup></label>
        <input type="text" required placeholder="pls enter First name">

        <label for="">Last Name</label>
        <input type="text">

        <br /> <br />
        <label for="">Email</label>
        <input type="email">
        <br /> <br />
        <label for="">Age</label>
        <input type="number">
        <br /> <br />
        <label for="">Password</label>
        <input type="password">
        <br /> <br />
        <label for="">Date Of Joining</label>
        <input type="date" />

        <br /> <br />

        <p>Enter your Shirt Size:</p>
        <input type="radio" name="ShirtSize" id="small" /> <label for="small">Small Size</label>
        <input type="radio" name="ShirtSize" id="medium" /> <label for="medium">Medium Size</label>
        <input type="radio" name="ShirtSize" id="large" /> <label for="large">Large Size</label>
        <br /> <br />
        <P>Select the known Langauage</P>
        <input type="checkbox" name="Langauage" id="english" /> <label for="english">English</label>
        <input type="checkbox" name="Langauage" id="hindi" /> <label for="hindi">Hindi</label>
        <input type="checkbox" name="Langauage" id="punjabi" /> <label for="punjabi">Punjabi</label>
        <input type="checkbox" name="Langauage" id="haryanvi" /> <label for="haryanvi">Haryanvi</label>
        <br /> <br />
        <label for="">please select the color of your Shirt</label>
        <input type="color">
        <br /> <br />
        <label for="paymentoption">Please Select the Payment Method</label>
        <select name="Payment" id="paymentoption">
            <option value=""></option>
            <option value="UPI">UPI</option>
            <option value="Netbanking">Netbanking</option>
            <option value="Card">Card</option>
            <option value="COD">COD</option>
        </select>
        <br /> <br />
        <label for="">please write your feedback</label>
        <textarea name="cmt" placeholder="pls write comment "></textarea>
        <br /> <br />
        <input type="reset">
        <br /> <br />
        <input type="submit">
    </form>

</body>

</html>
