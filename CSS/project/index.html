<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <img class="img" src="./PhotoshopExtension_Image (1).png" alt="" width="150">

        <form class="form">
            <div class="row">
                <label>First Name <sup>*</sup></label>
                <input type="text" required placeholder="Enter first name">
            </div>

            <div class="row">
                <label>Last Name</label>
                <input type="text">
            </div>

            <div class="row">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="row">
                <label>Age</label>
                <input type="number">
            </div>

            <div class="row">
                <label>Password</label>
                <input type="password">
            </div>

            <div class="row">
                <label>Date Of Birth</label>
                <input type="date">
            </div>

            <div class="row">
                <label>Select your course</label>
                <select>
                    <option></option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>BSc Data Science</option>
                    <option>BCom</option>
                </select>
            </div>

            <div class="row">
                <label>Payment Method</label>
                <select>
                    <option></option>
                    <option>UPI</option>
                    <option>Netbanking</option>
                    <option>Card</option>
                </select>
            </div>

            <div class="actions">
                <input type="reset">
                <input type="submit">
            </div>
        </form>

    </div>
</body>
</html>
