<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --accent:#C9184A;
  --primary:#FF6B9D;
  --bg1:#FFE5EC;
  --bg2:#FFC0CB;
}

body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Background */
.animated-bg{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  animation:bgShift 10s ease infinite;
  z-index:0;
}
@keyframes bgShift{
  50%{background:linear-gradient(135deg,var(--bg2),var(--bg1))}
}

/* Floating Elements */
.heart,.teddy{
  position:absolute;
  font-size:2rem;
  animation:floatUp linear forwards;
  pointer-events:none;
}
@keyframes floatUp{
  from{transform:translateY(100vh);opacity:0}
  10%{opacity:1}
  to{transform:translateY(-120px);opacity:0}
}

/* Kisses */
.kiss{
  position:absolute;
  font-size:1.8rem;
  animation:flyKiss ease-out forwards;
  pointer-events:none;
}
@keyframes flyKiss{
  from{transform:translate(0,0) scale(1);opacity:1}
  to{transform:translate(var(--tx),var(--ty)) scale(.5);opacity:0}
}

/* Main */
.love-container{
  position:relative;
  z-index:2;
  text-align:center;
  padding:2.5rem;
  animation:fadeIn 1.2s ease forwards;
}
@keyframes fadeIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}

.heart-beat{
  font-size:5rem;
  animation:heartbeat 1.5s infinite;
}
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  30%{transform:scale(1.2)}
}

.love-text{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(3rem,8vw,6rem);
  color:var(--accent);
  margin:1.5rem 0;
}

.subtitle{
  font-size:1.4rem;
  color:var(--accent);
  margin-bottom:2rem;
}

.message-box{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px);
  padding:2rem;
  border-radius:24px;
  max-width:600px;
  box-shadow:0 20px 50px rgba(201,24,74,.25);
}
.message-box p{
  color:var(--accent);
  font-size:1.1rem;
  line-height:1.7;
}

/* Back */
.back-button{
  position:fixed;
  top:1rem;
  left:1rem;
  padding:.7rem 1.4rem;
  border-radius:40px;
  border:none;
  background:rgba(255,255,255,.9);
  color:var(--accent);
  font-weight:500;
  cursor:pointer;
  z-index:5;
}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important}
}
</style>
</head>

<body>

<div class="animated-bg"></div>
<button class="back-button" onclick="history.back()">← Back</button>

<div class="love-container">
  <div class="heart-beat">❤️</div>
  <h1 class="love-text">I Love You</h1>
  <p class="subtitle">Forever and always</p>

  <div class="message-box">
    <p>
      You are my calm, my happiness, and my favorite place to be.
      Loving you is effortless, constant, and real.
    </p>
  </div>
</div>

<script>
const limit=(c,m)=>document.querySelectorAll('.'+c).length<m;

/* Hearts */
setInterval(()=>{
  if(!limit('heart',18))return;
  const e=document.createElement('div');
  e.className='heart';
  e.textContent='❤️';
  e.style.left=Math.random()*100+'%';
  e.style.animationDuration=Math.random()*4+5+'s';
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),9000);
},900);

/* Teddies */
setInterval(()=>{
  if(!limit('teddy',10))return;
  const e=document.createElement('div');
  e.className='teddy';
  e.textContent=['🧸','🐻'][Math.floor(Math.random()*2)];
  e.style.left=Math.random()*100+'%';
  e.style.animationDuration=Math.random()*6+8+'s';
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),15000);
},1600);

/* Kisses */
setInterval(()=>{
  if(!limit('kiss',12))return;
  const e=document.createElement('div');
  e.className='kiss';
  e.textContent='💋';
  e.style.left=Math.random()*100+'%';
  e.style.top=Math.random()*100+'%';
  e.style.setProperty('--tx',(Math.random()-.5)*600+'px');
  e.style.setProperty('--ty',(Math.random()-.5)*600+'px');
  e.style.animationDuration=Math.random()*2+4+'s';
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),7000);
},800);
</script>

</body>
</html>
